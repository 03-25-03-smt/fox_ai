# Fox AI для Windows: Ollama работает нативно на Windows (на Tesla P100),
# всё остальное здесь, в Docker Desktop (WSL2).
#
# Почему так: P100 в режиме TCC не видна в WSL2/Docker, зато нативный Ollama
# работает с ней напрямую и читает модели с любого диска без потерь скорости.
# В контейнерах видны только RTX 3070 и GTX 1050 (они в режиме WDDM):
#   imagegen → RTX 3070 (GPU_IMAGEGEN), speech → GTX 1050 (GPU_SPEECH).
# Выбор карты — через CUDA_VISIBLE_DEVICES: Docker Desktop отдаёт контейнеру
# все карты сразу, а выбор конкретной по device_ids работает не везде.
#
# Сервисы speech и imagegen необязательные: закомментируй их и поставь в .env
# пустые SPEECH_URL= / IMAGEGEN_URL=.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Ротация логов: без неё логи контейнеров потихоньку съедают диск
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

networks:
  default: {}
  # Внутренняя сеть без выхода в интернет — для песочницы
  sandbox_net:
    internal: true

# Данные живут внутри диска Docker Desktop (переносится на HDD в настройках).
# SQLite в named volume надёжнее, чем на папке Windows: там нет нормальных блокировок.
volumes:
  bot_data: {}
  models: {}   # Whisper и SDXL-Turbo (кэш Hugging Face)
  prometheus_data: {}
  grafana_data: {}
  open_webui: {}

services:
  searxng:
    image: searxng/searxng:2026.9.29-f5035873a
    restart: unless-stopped
    <<: *logging
    # Порт наружу не публикуем — поиском пользуется только бот
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?задай SEARXNG_SECRET в .env}

  sandbox:
    build: ./services/sandbox
    restart: unless-stopped
    <<: [*hardening, *logging]
    init: true            # подбирает зомби-процессы после форк-бомб
    read_only: true
    tmpfs:
      - /tmp:exec,size=512m
    networks: [sandbox_net]  # без интернета
    mem_limit: 2g
    pids_limit: 256
    cpus: 4

  speech:
    build: ./services/speech
    restart: unless-stopped
    <<: [*hardening, *logging, *gpu]
    volumes:
      - models:/models
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU_SPEECH:-0}

  imagegen:
    build: ./services/imagegen
    restart: unless-stopped
    <<: [*hardening, *logging, *gpu]
    volumes:
      - models:/models
    environment:
      - IMAGEGEN_MODEL=${IMAGEGEN_MODEL:-stabilityai/sdxl-turbo}
      - IMAGEGEN_CPU_OFFLOAD=1
      - IDLE_UNLOAD_SECONDS=120
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${GPU_IMAGEGEN:-0}

  bot:
    build: .
    restart: unless-stopped
    <<: [*hardening, *logging]
    env_file: .env
    environment:
      # Ollama запущен на самой Windows; host.docker.internal — это хост
      - OLLAMA_URL=http://host.docker.internal:11434
      - SEARXNG_URL=http://searxng:8080
      - SANDBOX_URL=http://sandbox:8000
      - SPEECH_URL=${SPEECH_URL-http://speech:8000}
      - IMAGEGEN_URL=${IMAGEGEN_URL-http://imagegen:8000}
      - DB_PATH=/app/data/fox_ai.sqlite3
      - KNOWLEDGE_DIR=/app/knowledge
      - BACKUP_DIR=/app/backups
      # Температуры всех трёх карт пишет на хосте windows/gpu-stats.ps1
      - GPU_STATS_FILE=/app/gpu/gpu.csv
      # /metrics для Prometheus — только внутри docker-сети, наружу порт не публикуется
      - METRICS_PORT=9101
      # Обмен с агентом Windows (windows/fox-agent.ps1): /logs, /restart, /power
      - HOST_DIR=/app/host
    volumes:
      - bot_data:/app/data
      - ./knowledge:/app/knowledge
      - ./data/gpu:/app/gpu:ro
      - ./data/host:/app/host
      - ${BACKUP_HOST_DIR:-./data/backups}:/app/backups
    networks: [default, sandbox_net]
    depends_on:
      - searxng
      - sandbox

  # ---------------------------------------------------------------- мониторинг (профиль monitoring)
  # Графики температуры, VRAM, скорости и запросов: http://localhost:3000 (только с этого ПК)

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    <<: [*hardening, *logging]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [bot]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    <<: [*hardening, *logging]
    # Только localhost: снаружи Grafana недоступна
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fox-ai.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---------------------------------------------------------------- Open WebUI (профиль webui)
  # Веб-чат на той же Ollama для длинных сессий за компьютером: http://localhost:3001
  # Первый зарегистрированный пользователь становится админом; следующие ждут его одобрения
  # (DEFAULT_USER_ROLE=pending). Пустой WEBUI_SECRET_KEY — ключ сгенерируется и сохранится в томе.

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    profiles: [webui]
    restart: unless-stopped
    <<: *logging
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - DEFAULT_USER_ROLE=pending
      - ANONYMIZED_TELEMETRY=false
      - ENABLE_OPENAI_API=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
    volumes:
      - open_webui:/app/backend/data
