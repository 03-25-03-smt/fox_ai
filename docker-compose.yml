# Fox AI на Linux (Ubuntu 24.04): всё в Docker, LLM — на своей карте.
#   ollama   → Tesla P100 (GPU_LLM)      все LLM и эмбеддинги
#   imagegen → RTX 3070  (GPU_IMAGEGEN) /draw
#   speech   → RTX 3070  (GPU_SPEECH)   Whisper; ~1 ГБ, выгружается через 10 минут простоя
# Карты задаются UUID (GPU-…) или номером из `nvidia-smi -L`; linux/install.sh сам находит их
# по имени и вписывает UUID в .env. Контейнер видит только свои карты.
#
# Сервисы speech и imagegen необязательные: закомментируй их и поставь в .env
# пустые SPEECH_URL= / IMAGEGEN_URL=.

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Ротация логов: без неё логи контейнеров потихоньку съедают диск
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

networks:
  default: {}
  # Внутренняя сеть без выхода в интернет — для песочницы
  sandbox_net:
    internal: true

# Тома Docker живут в data-root Docker — на HDD 1 ТБ (/data/docker, linux/setup-host.sh).
# Модели Ollama — отдельной папкой OLLAMA_MODELS_DIR (по умолчанию на системном SSD: грузятся быстрее).
volumes:
  bot_data: {}
  models: {}   # Whisper и SDXL-Turbo (кэш Hugging Face)
  prometheus_data: {}
  grafana_data: {}
  open_webui: {}

services:
  ollama:
    image: ollama/ollama:0.35.0
    restart: unless-stopped
    <<: *logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLM:?задай GPU_LLM в .env (UUID Tesla P100; linux/install.sh найдёт сам)}"]
              capabilities: [gpu]
    # Только localhost: у Ollama нет авторизации. Бот и Open WebUI ходят по docker-сети
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-/var/lib/fox-ollama}:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=${MAX_CONCURRENT:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}

  searxng:
    image: searxng/searxng:2026.9.29-f5035873a
    restart: unless-stopped
    <<: *logging
    # Порт наружу не публикуем — поиском пользуется только бот
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?задай SEARXNG_SECRET в .env}

  sandbox:
    build: ./services/sandbox
    restart: unless-stopped
    <<: [*hardening, *logging]
    init: true            # подбирает зомби-процессы после форк-бомб
    read_only: true
    tmpfs:
      - /tmp:exec,size=512m
    networks: [sandbox_net]  # без интернета
    mem_limit: 2g
    pids_limit: 256
    cpus: 4

  speech:
    build: ./services/speech
    restart: unless-stopped
    <<: [*hardening, *logging]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_SPEECH:?задай GPU_SPEECH в .env (UUID RTX 3070; linux/install.sh найдёт сам)}"]
              capabilities: [gpu]
    volumes:
      - models:/models
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE=${WHISPER_COMPUTE:-int8_float16}

  imagegen:
    build: ./services/imagegen
    restart: unless-stopped
    <<: [*hardening, *logging]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_IMAGEGEN:?задай GPU_IMAGEGEN в .env (UUID RTX 3070; linux/install.sh найдёт сам)}"]
              capabilities: [gpu]
    volumes:
      - models:/models
    environment:
      - IMAGEGEN_MODEL=${IMAGEGEN_MODEL:-stabilityai/sdxl-turbo}
      - IMAGEGEN_CPU_OFFLOAD=1
      - IDLE_UNLOAD_SECONDS=120

  bot:
    build: .
    restart: unless-stopped
    <<: [*hardening, *logging]
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
      - SANDBOX_URL=http://sandbox:8000
      - SPEECH_URL=${SPEECH_URL-http://speech:8000}
      - IMAGEGEN_URL=${IMAGEGEN_URL-http://imagegen:8000}
      - DB_PATH=/app/data/fox_ai.sqlite3
      - KNOWLEDGE_DIR=/app/knowledge
      - BACKUP_DIR=/app/backups
      # Температуры всех карт пишет агент на хосте (linux/fox-agent.py): бот GPU не видит
      - GPU_STATS_FILE=/app/gpu/gpu.csv
      # /metrics для Prometheus — только внутри docker-сети, наружу порт не публикуется
      - METRICS_PORT=9101
      # Обмен с агентом хоста (linux/fox-agent.py): /logs, /restart, /power
      - HOST_DIR=/app/host
    volumes:
      - bot_data:/app/data
      - ./knowledge:/app/knowledge
      - ./data/gpu:/app/gpu:ro
      - ./data/host:/app/host
      - ${BACKUP_HOST_DIR:-./data/backups}:/app/backups
    networks: [default, sandbox_net]
    depends_on:
      - ollama
      - searxng
      - sandbox

  # ---------------------------------------------------------------- мониторинг (профиль monitoring)
  # Графики температуры, VRAM, скорости и запросов: http://localhost:3000 (только с этого ПК / через SSH-туннель)

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    restart: unless-stopped
    <<: [*hardening, *logging]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [bot]

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    restart: unless-stopped
    <<: [*hardening, *logging]
    # Только localhost: снаружи Grafana недоступна
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fox-ai.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ---------------------------------------------------------------- Open WebUI (профиль webui)
  # Веб-чат на той же Ollama для длинных сессий за компьютером: http://localhost:3001
  # Первый зарегистрированный пользователь становится админом; следующие ждут его одобрения
  # (DEFAULT_USER_ROLE=pending). Пустой WEBUI_SECRET_KEY — ключ сгенерируется и сохранится в томе.

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    profiles: [webui]
    restart: unless-stopped
    <<: *logging
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - DEFAULT_USER_ROLE=pending
      - ANONYMIZED_TELEMETRY=false
      - ENABLE_OPENAI_API=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
    volumes:
      - open_webui:/app/backend/data
    depends_on: [ollama]
